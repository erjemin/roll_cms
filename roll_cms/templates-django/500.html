<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>RollCMS: error 500</title>
  <link rel="stylesheet" href="/static/fontawesome-free-6.5.2-web/css/all.min.css" />
  <style>
    body {
      background-color: whitesmoke;
      background-image: url("/static/svg/rollcms-logo-bo.svg");
      background-repeat: no-repeat;
      background-position: 102.5% 100.5%;
      background-size: 80% auto;
      /* background: linear-gradient(to bottom, whitesmoke, wheat); */
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow:scroll;
      overflow-x:hidden;
      overflow-y:hidden;
      overflow: hidden;
    }
    .container {
      display: flex;
      width: 100%; height: 100%;
      box-sizing: border-box;
    }
    .atropos-banner img {
      position: absolute;
      left: -5%; top: -5%;
      width: 110%; height: 110%;
      object-fit: cover;
      display: block;
      z-index: 1;
      transform-style: preserve-3d;
      pointer-events: none;
      background-size: cover;
    }
    .atropos-banner img.atropos-banner-spacer {
      position: relative;
      width: 100%; height: 100%;
      left: 0; top: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="container atropos-wrap">
    <div href="#" class="atropos atropos-banner">
      <div class="atropos-scale">
        <div class="atropos-rotate">
          <div class="atropos-inner">
            <img class="atropos-banner-spacer" src="/static/svg/bg-stars-1-atropos.svg" style="height: 100vh; width: 100vw;">
            <img data-atropos-offset="-12" src="/static/svg/bg-stars-1-atropos.svg">
            <img data-atropos-offset="-4" src="/static/svg/bg-stars-2-atropos.svg">
            <img data-atropos-offset=-22" src="/static/svg/bg-stars-4-atropos.svg">
            <img data-atropos-offset="8" src="/static/svg/bg-stars-3-atropos.svg">
          </div>
        </div>
        <div style="position: absolute; top:10vh; left:10vw; width: 50vw; height: auto; background: #661122dd; padding: 2ex; border-radius: 2em; box-shadow: #6f42c166 1ex 1ex 1em;">
          <img src="/static/svg/rollcms-logo-w.svg" style="width: 24vw; height: auto; position: relative; left: 2ex; top: 2ex;" />
          <h3 style="position: relative; left: 2ex; top: 2ex; padding-bottom: 2ex;">error 500 <i class="fa-solid fa-bug"></i> don't panic&hellip;</h3>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/atropos.min.js" type="text/javascript"></script>
  <script type="text/javascript">
    window.atropos = new Atropos({
      el: document.querySelectorAll('.atropos')[0],
      // shadowScale: 1.05,
      alwaysActive: true,
    });
  </script>

</body>
</html>
